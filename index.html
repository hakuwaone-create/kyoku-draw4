<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>極ドロー4討滅戦｜オンライン対戦 v1.3</title><style>
:root{font-family:system-ui,'Yu Gothic',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#f6f0e4;background:radial-gradient(ellipse at top,#342248 0,#111020 53%,#08080f 100%)}main{max-width:680px;margin:auto;padding:24px 15px 60px}h1{font-size:clamp(27px,6vw,43px);text-align:center;color:#e7c581;text-shadow:0 0 30px #ad76e6;margin:22px 0 8px}h2{font-size:21px;margin:0 0 15px}.sub{text-align:center;color:#c7b5e4;font-size:12px;letter-spacing:.12em;margin-bottom:24px}.panel{padding:22px;margin:15px 0;border:1px solid #846da4;border-radius:17px;background:#1c192be8;box-shadow:0 10px 32px #0006}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}label{display:block;color:#d9caeb;font-size:13px;margin:12px 0 6px}input{width:100%;padding:13px;border:1px solid #8d779c;border-radius:9px;background:#111021;color:white;font-size:17px}button{border:1px solid #c7a86d;background:linear-gradient(#56436d,#2b223d);border-radius:10px;color:#fff0d3;padding:13px 17px;font-weight:700;cursor:pointer;font-size:15px}button.primary{background:linear-gradient(#ebd18c,#9e713a);color:#1d1524}button:disabled{opacity:.45;cursor:default}.hidden{display:none!important}.code{font-size:40px;font-weight:900;letter-spacing:.2em;color:#f2d88f;text-align:center;margin:15px 0}.muted{color:#bdb2cd;font-size:13px}.member{padding:13px;border:1px solid #6a587c;background:#251f35;border-radius:10px;margin:7px 0}.tag{font-size:11px;border-radius:6px;background:#5c4574;padding:3px 7px;margin-left:7px}.error{color:#ffb3aa}.ok{color:#a8e7d0}.status{min-height:23px;margin:8px 0 18px;text-align:center}.foot{text-align:center;color:#a99cb9;font-size:12px;line-height:1.8;margin-top:30px}#share{font-size:13px}
.cards{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.card{min-width:55px;min-height:85px;border:2px solid #ddd;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:22px;font-weight:900;text-shadow:0 2px 4px #0008;box-shadow:0 4px 10px #0005;padding:8px;cursor:pointer}.card small{font-size:10px}.card.big{margin:14px auto;width:115px;height:155px;font-size:38px}.card.red{background:linear-gradient(135deg,#e96d48,#8e2529)}.card.blue{background:linear-gradient(135deg,#58c7e9,#1d488f)}.card.green{background:linear-gradient(135deg,#8edb7b,#24683b)}.card.yellow{background:linear-gradient(135deg,#f5d67a,#b27d20)}.card.wild{background:conic-gradient(#d35c5c,#dec563,#67b87d,#508fd0,#d35c5c)}.card:disabled{opacity:.45;cursor:default}.battleline{padding:8px;border-bottom:1px solid #554660}.active{color:#f5d588;font-weight:900}#event{min-height:35px;text-align:center}#colorselect{padding:12px;border:1px solid #d2b375;border-radius:10px;margin-top:15px}#colorselect button[data-color=red]{background:#a33333}#colorselect button[data-color=blue]{background:#2459a4}#colorselect button[data-color=green]{background:#327c43}#colorselect button[data-color=yellow]{background:#b58a28}
/* Ver.1.3 battle clarity */
main{max-width:790px}.battleline{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px;border:1px solid #4f4162;border-radius:10px;margin:6px 0;background:#211b30}.battleline.active{border-color:#f2d28b;background:#433150;box-shadow:0 0 14px #c8a26855}.battleline .who{font-weight:800}.battleline .meta{font-size:13px;color:#dfcfae}.card{position:relative;min-width:66px;min-height:98px;border-width:3px;box-shadow:inset 0 0 0 3px #ffffff38,0 5px 15px #0008;transition:transform .15s,filter .15s}.card:not(:disabled):hover{transform:translateY(-6px)}.card .glyph{font-size:30px;line-height:1.1}.card .label{font-size:10px;letter-spacing:.06em;margin-top:6px}.card.big{width:142px;height:196px;border-radius:17px;cursor:default}.card.big .glyph{font-size:61px}.card.big .label{font-size:15px}.card.wild{background:conic-gradient(from 20deg,#b52636 0 25%,#e2b533 25% 50%,#268b58 50% 75%,#2365b6 75% 100%)}.card.yellow{color:#271800;text-shadow:0 1px #ffffff99}.card:disabled{opacity:.68}#colorbanner{font-size:21px;font-weight:900;text-align:center;padding:12px;border-radius:12px;margin:10px 0;border:1px solid #b49d6d}#colorbanner.red{background:#79282b}#colorbanner.blue{background:#174b86}#colorbanner.green{background:#1c653c}#colorbanner.yellow{background:#b99130;color:#1b1221}#pending{font-size:21px;font-weight:900;padding:8px}#turninfo{letter-spacing:.02em}.controlstrip{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:8px 0 16px}.controlstrip button{padding:8px 12px;font-size:13px}#fxlayer{position:fixed;inset:0;z-index:9999;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .18s;background:radial-gradient(circle,#ffffff18,#000b)}#fxlayer.show{opacity:1}#fxbox{width:min(92vw,650px);text-align:center;padding:32px 14px;border:2px solid #e6c57e;border-radius:20px;background:linear-gradient(130deg,#171323f2,#392449ef,#151323f2);box-shadow:0 0 70px #9d69e488;animation:fxzoom .45s ease-out}#fxicon{font-size:clamp(56px,12vw,112px);filter:drop-shadow(0 0 20px #fff5)}#fxtitle{font-size:clamp(31px,8vw,68px);font-weight:1000;color:#f8d98a;text-shadow:0 0 20px #e8a550;line-height:1.2}#fxdesc{font-size:clamp(14px,3.5vw,21px);margin-top:12px;color:#fff}#fxlayer.mega{background:radial-gradient(circle,#c73d3d99,#130717e8)}#fxlayer.mega #fxbox{border-color:#ff8a65;box-shadow:0 0 100px #ff563d}#fxlayer.win #fxbox{border-color:#ffe9a2;box-shadow:0 0 100px #e4ba49}@keyframes fxzoom{from{transform:scale(.6);filter:blur(8px)}to{transform:scale(1);filter:blur(0)}}@media(max-width:520px){.panel{padding:15px}.card{min-width:58px;min-height:88px}.cards{gap:5px}}
</style></head><body><main><h1>⚔️ 極ドロー4討滅戦</h1><div class="sub">ONLINE BATTLE · Ver.1.3</div><div id="status" class="status muted">通信の準備中…</div>
<section id="entry" class="panel"><h2>冒険者の集会所</h2><label for="name">プレイヤー名</label><input id="name" maxlength="24" placeholder="ヒカセンの名前" autocomplete="nickname"><div class="row" style="margin-top:16px"><button id="create" class="primary" disabled>部屋を作る</button></div><hr style="border:0;border-top:1px solid #554660;margin:24px 0"><label for="roomcode">招待コード（6文字）</label><input id="roomcode" maxlength="6" placeholder="ABC123" autocapitalize="characters"><button id="join" style="width:100%;margin-top:13px" disabled>部屋に参加</button></section>
<section id="lobby" class="panel hidden"><h2>🏰 集会所ロビー</h2><div class="muted" style="text-align:center">招待コード</div><div id="code" class="code">------</div><div class="row"><button id="copycode">コードをコピー</button><button id="copyurl" class="primary">招待URLをコピー</button></div><label for="share">招待URL</label><input id="share" readonly><h2 style="margin-top:24px">参加メンバー <span id="count" class="muted"></span></h2><div id="members"></div><p id="hostnote" class="muted"></p><button id="start" class="primary hidden" style="width:100%;margin-top:12px">⚔️ 討滅戦を開始</button><button id="leave" style="width:100%;margin-top:12px">ロビーから退出</button></section>
<section id="battle" class="panel hidden"><h2>⚔️ 討滅戦</h2><div class="controlstrip"><span class="muted">カードをタップして出撃！</span><button id="soundtoggle" type="button">🔊 効果音 ON</button></div><div id="event" class="muted"></div><div id="battleplayers"></div><div id="turninfo" class="code" style="font-size:21px"></div><div id="topcard" class="card big"></div><div id="colorbanner"></div><div id="pending" class="error" style="text-align:center"></div><h2>自分の手札 <span id="handcount"></span></h2><div id="hand" class="cards"></div><div class="row" style="margin-top:14px"><button id="draw">カードを引く</button><button id="challenge" class="hidden">⚡ +4チャレンジ</button></div><div id="colorselect" class="hidden"><p>色を選択</p><div class="row"><button data-color="red">🔥 赤</button><button data-color="blue">🌊 青</button><button data-color="green">🌪️ 緑</button><button data-color="yellow">🪨 黄</button></div><button id="cancelcolor">キャンセル</button></div><button id="battleleave" style="width:100%;margin-top:16px">ロビー表示へ</button></section><div class="foot">オンライン対戦テスト版。カード操作はサーバー側で判定します。<br>特殊演出・効果音対応。LB宣言とペナルティは次のサーバー更新で実装予定。</div></main><div id="fxlayer" aria-live="polite"><div id="fxbox"><div id="fxicon"></div><div id="fxtitle"></div><div id="fxdesc"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
const SUPABASE_URL='https://tykhbhpzrvfaqdqwgykl.supabase.co';
const SUPABASE_KEY='sb_publishable_53s1JnSmZcqOAyNJXTKfNA_ylOPy6D2';
const $=id=>document.getElementById(id);
const sb=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let currentCode='',busy=false,interval=null,game=null,picked=null,gameBusy=false,lastRevision=-1;let soundOn=localStorage.getItem('kd4_sound')!=='off',audioCtx=null,fxTimer=null;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(t,kind='muted'){$('status').textContent=t;$('status').className='status '+kind}
function setBusy(v){busy=v;$('create').disabled=v;$('join').disabled=v}
function inviteUrl(code){let u=new URL(location.href);u.searchParams.set('room',code);return u.toString()}
function showEntry(){$('entry').classList.remove('hidden');$('lobby').classList.add('hidden');$('battle').classList.add('hidden');currentCode='';clearInterval(interval);interval=null}
function showLobby(code){currentCode=code;$('entry').classList.add('hidden');$('lobby').classList.remove('hidden');$('code').textContent=code;$('share').value=inviteUrl(code);history.replaceState({},'',inviteUrl(code));clearInterval(interval);interval=setInterval(()=>refresh(true),1800);refresh()}
async function rpc(name,args){let {data,error}=await sb.rpc(name,args);if(error)throw Error(error.message);return data}
async function ready(){if(!sb)throw Error('Supabaseの通信ライブラリを読み込めません');let {data:{session},error}=await sb.auth.getSession();if(error)throw error;if(!session){let res=await sb.auth.signInAnonymously();if(res.error)throw res.error}setBusy(false);status('オンライン接続OK','ok');let n=localStorage.getItem('kd4_player_name');if(n)$('name').value=n;let code=new URLSearchParams(location.search).get('room');if(code){$('roomcode').value=code.toUpperCase();status('招待コードを確認しました。名前を入力して「部屋に参加」を押してね。','ok')}}
async function run(action){if(busy)return;setBusy(true);try{let name=$('name').value.trim();if(!name||name.length>24)throw Error('プレイヤー名を1〜24文字で入力してね');localStorage.setItem('kd4_player_name',name);let result;if(action==='create'){result=await rpc('kd4_create_room',{p_name:name})}else{let code=$('roomcode').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code))throw Error('招待コードは英数字6文字だよ');result=await rpc('kd4_join_room',{p_code:code,p_name:name})}showLobby(result.code);status('ロビーに入室しました！','ok')}catch(e){status('エラー：'+e.message,'error')}finally{setBusy(false)}}
async function refresh(silent=false){if(!currentCode||!sb)return;try{let data=await rpc('kd4_get_lobby',{p_code:currentCode});if(data.status!=='lobby'){$('hostnote').textContent='対戦中！ 下の対戦画面を確認してね。';$('start').classList.add('hidden');await loadGame()}else{$('hostnote').textContent=data.is_host?'👑 あなたがホストです。仲間に招待URLを送ろう！':'ホストが準備中です。'}$('start').classList.toggle('hidden',!data.is_host||data.players.length<2||data.status!=='lobby');$('count').textContent=`（${data.players.length} / ${data.max_players}人）`;$('members').innerHTML=data.players.map(p=>`<div class="member">${escapeHtml(p.name)}${p.host?'<span class="tag">HOST</span>':''}${p.me?'<span class="tag">YOU</span>':''}</div>`).join('')}catch(e){if(!silent)status('更新エラー：'+e.message,'error')}}
async function copy(text){try{await navigator.clipboard.writeText(text);status('コピーしたよ！','ok')}catch(e){prompt('ここをコピーしてね',text)}}
const symbols={skip:'🚫',reverse:'🔄',d2:'⚡+2',d4:'🐉+4',wild:'🌈'};
const cardNames={skip:'SKIP',reverse:'REVERSE',d2:'DRAW TWO',d4:'DRAW FOUR',wild:'WILD'};
const colorNames={red:'🔥 イフリート・赤',blue:'🌊 リヴァイアサン・青',green:'🌪️ ガルーダ・緑',yellow:'🪨 タイタン・黄'};
function playSound(type){if(!soundOn)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();let t=audioCtx.currentTime;const tones=type==='mega'?[110,165,220,330,440]:type==='win'?[392,494,587,784]:type==='bad'?[330,220,165]:[440,554,659];tones.forEach((hz,i)=>{let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type==='mega'?'sawtooth':'triangle';o.frequency.setValueAtTime(hz,t+i*.09);g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(type==='mega'?.075:.045,t+i*.09+.018);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.22);o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.09);o.stop(t+i*.09+.24)})}catch(e){}}
function showFx(icon,title,desc,kind='normal'){const layer=$('fxlayer');clearTimeout(fxTimer);layer.className=kind+' show';$('fxicon').textContent=icon;$('fxtitle').textContent=title;$('fxdesc').textContent=desc;playSound(kind==='mega'?'mega':kind==='win'?'win':kind==='bad'?'bad':'normal');fxTimer=setTimeout(()=>layer.className='',kind==='mega'?1900:1350)}
function eventFx(ev){if(!ev)return;let v=ev.card?.v||'';if(ev.type==='challenge_success')return showFx('⚔️','CHALLENGE SUCCESS!',ev.text||'チャレンジ成功！','win');if(ev.type==='challenge_fail')return showFx('💀','CHALLENGE FAILED!',ev.text||'チャレンジ失敗！','bad');if(ev.type==='start')return showFx('⚔️','DUTY COMMENCED!',ev.text||'討滅戦開始！','win');if(ev.finish)return showFx('👑','VICTORY!',ev.finish+' が '+ev.rank+'位で討滅！','win');if(ev.type==='draw')return showFx('🃏','DRAW '+(ev.count||1),ev.text||'カードを引いた');if(ev.type==='play'){if(v==='d4')return showFx('🐉','MEGA FLARE!',ev.text||'ドロー4発動！','mega');if(v==='d2')return showFx('⚡','DRAW +2!',ev.text||'ドロー2発動！');if(v==='skip')return showFx('🚫','SKIP!',ev.text||'スキップ！');if(v==='reverse')return showFx('🔄','REVERSE!',ev.text||'リバース！');if(v==='wild')return showFx('🌈','ELEMENT SHIFT!',ev.text||'色変更！');return showFx('🃏','CARD PLAY!',ev.text||'カードを出した')}}

function cardLabel(c){return symbols[c.v]||c.v}
function cardHtml(c,index){return `<button class="card ${escapeHtml(c.c)}" data-index="${index}" title="${escapeHtml(cardNames[c.v]||c.v)}"><span class="glyph">${escapeHtml(cardLabel(c))}</span><span class="label">${escapeHtml(cardNames[c.v]||c.v)}</span></button>`}
async function action(act,index=null,color=null){if(gameBusy)return;gameBusy=true;try{const args={p_code:currentCode,p_action:act};if(index!==null)args.p_card=index;if(color)args.p_color=color;const data=await rpc('kd4_game',args);game=data;renderGame();status('オンライン接続OK','ok')}catch(e){status('操作エラー：'+e.message,'error')}finally{gameBusy=false}}
async function loadGame(){if(!currentCode||gameBusy)return;try{const data=await rpc('kd4_game',{p_code:currentCode,p_action:'state'});game=data;renderGame()}catch(e){status('対戦情報の取得エラー：'+e.message,'error')}}
function renderGame(){if(!game)return;if(game.status==='lobby')return;$('lobby').classList.add('hidden');$('battle').classList.remove('hidden');$('entry').classList.add('hidden');const me=game.players.find(p=>p.me);const turn=game.players.find(p=>p.seat===game.turn);$('event').textContent=game.event?.text||'対戦中';$('battleplayers').innerHTML=game.players.map(p=>`<div class="battleline ${p.seat===game.turn?'active':''}"><span class="who">${p.seat===game.turn?'▶ ':''}${escapeHtml(p.name)} ${p.me?'（YOU）':''}</span><span class="meta">🃏 ${p.count}枚 ${p.rank?'🏆'+p.rank+'位':''} ${p.seat===game.turn?'⚔️ 手番':''}</span></div>`).join('');$('turninfo').textContent=game.status==='finished'?'🏆 討滅戦終了':(turn?turn.name+' の番':'待機中');$('topcard').className='card big '+(game.top?.c||'wild');$('topcard').innerHTML=game.top?`<span class="glyph">${escapeHtml(cardLabel(game.top))}</span><span class="label">${escapeHtml(cardNames[game.top.v]||game.top.v)}</span>`:'';$('colorbanner').className=game.color||'';$('colorbanner').textContent='現在の属性：'+(colorNames[game.color]||game.color||'不明');$('pending').textContent=game.pending>0?'⚠️ ドロー '+game.pending+'枚！':'';$('handcount').textContent=`（${game.hand.length}枚）`;$('hand').innerHTML=game.hand.map((c,i)=>cardHtml(c,i)).join('');const myturn=game.status==='playing'&&me?.seat===game.turn&&!me.rank;$('hand').querySelectorAll('button').forEach(b=>b.disabled=!myturn);$('draw').disabled=!myturn;$('challenge').classList.toggle('hidden',!myturn||!game.can_challenge);$('colorselect').classList.add('hidden');$('hand').querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.index;if(game.hand[i].c==='wild'){picked=i;$('colorselect').classList.remove('hidden')}else action('play',i)});if(game.revision!==lastRevision){const old=lastRevision;lastRevision=game.revision;if(old>=0)eventFx(game.event)}}
$('soundtoggle').textContent=soundOn?'🔊 効果音 ON':'🔇 効果音 OFF';$('soundtoggle').onclick=()=>{soundOn=!soundOn;localStorage.setItem('kd4_sound',soundOn?'on':'off');$('soundtoggle').textContent=soundOn?'🔊 効果音 ON':'🔇 効果音 OFF';if(soundOn)playSound('normal')};$('start').onclick=()=>action('start');$('draw').onclick=()=>action('draw');$('challenge').onclick=()=>{if(confirm('直前の+4をチャレンジする？'))action('challenge')};document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{if(picked!==null)action('play',picked,b.dataset.color);picked=null});$('cancelcolor').onclick=()=>{$('colorselect').classList.add('hidden');picked=null};$('battleleave').onclick=()=>{$('battle').classList.add('hidden');$('lobby').classList.remove('hidden')};
$('create').onclick=()=>run('create');$('join').onclick=()=>run('join');$('roomcode').oninput=e=>e.target.value=e.target.value.toUpperCase();$('copycode').onclick=()=>copy(currentCode);$('copyurl').onclick=()=>copy(inviteUrl(currentCode));$('leave').onclick=async()=>{if(!currentCode)return;try{await rpc('kd4_leave_lobby',{p_code:currentCode});history.replaceState({},'',location.pathname);showEntry();status('ロビーを退出しました','ok')}catch(e){status('退出エラー：'+e.message,'error')}};
ready().catch(e=>{setBusy(true);status('接続エラー：'+e.message+'（SupabaseのAnonymous Sign-Ins設定を確認）','error')});
</script></body></html>
